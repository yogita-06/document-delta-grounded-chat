services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    environment: ["LLM_PROVIDER=mock"]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
