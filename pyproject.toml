[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-delta-chat"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
  "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0",
  "pymupdf>=1.24", "pillow>=10", "pytesseract>=0.3.13", "opencv-python-headless>=4.10",
  "rapidfuzz>=3.9", "numpy>=1.26", "scipy>=1.13", "structlog>=24.2",
  "httpx>=0.27", "jinja2>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "reportlab>=4.2"]
openai = ["openai>=1.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
